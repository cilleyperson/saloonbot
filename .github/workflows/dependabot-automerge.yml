name: Dependabot auto-merge

# Auto-merge patch/minor Dependabot PRs once required checks pass. Major bumps
# are left for human review. SAFETY: this calls `gh pr merge --auto`, which only
# merges after branch-protection's required status checks (ci.yml) succeed. If
# branch protection requiring "CI / Test + audit" is NOT configured, auto-merge
# would merge on green-or-not — so that protection is a prerequisite, not optional.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
