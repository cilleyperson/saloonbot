# Saloon Bot - Docker Compose Configuration
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f
#   docker compose -f docker/docker-compose.yml down
#
# Or use the helper scripts in docker/scripts/

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: saloon-bot
    restart: unless-stopped

    # Environment variables
    env_file:
      - ../.env

    environment:
      # Override database path for container
      - DATABASE_PATH=/app/data/bot.db
      # Ensure proper logging
      - NODE_ENV=production

    # Port mapping for web interface
    ports:
      - "${PORT:-3000}:3000"

    # Persistent storage for database and logs
    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
      # Object detection is opt-in: the YOLO model is gitignored and not baked
      # into the image. Run `node scripts/download-yolo-model.js` on the host,
      # then this read-only mount makes models/ available in the container.
      # Without it, detection logs a warning and the bot serves everything else.
      - ../models:/app/models:ro

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Health check configuration - hits unauthenticated /healthz on PORT,
    # not GET / (which is behind auth and 302-redirects).
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.PORT||3000;require('http').get('http://127.0.0.1:'+p+'/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes for data persistence
volumes:
  bot-data:
    name: saloon-bot-data
  bot-logs:
    name: saloon-bot-logs
